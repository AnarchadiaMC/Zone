name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-test:
    name: Go Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Server Tests
        working-directory: zone-server
        run: go test -v -race ./...

  client-build:
    name: Client Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S zone-client -B zone-client/build -G "Visual Studio 17 2022" -A x64

      - name: Build Client (Release)
        run: cmake --build zone-client/build --config Release
